name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  app-auth:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Mint repository CI App token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.TCC_CI_CLIENT_ID }}
          private-key: ${{ secrets.TCC_CI_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-actions: write
          permission-workflows: write

      - name: Verify repository API access
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh api "repos/${{ github.repository }}" --jq .full_name

  auth-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pyyaml
      - run: pytest tests/test_ci_auth.py -q

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure git identity
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@test"

      - name: Install
        run: pip install -e .[dev]

      - name: Lint
        run: ruff check src/ tests/ --exclude tests/integration/fixtures/

      - name: Size baseline
        run: python scripts/size_gate.py

      - name: Size gate rejects a new oversized unit
        run: |
          printf "def oversized(a, b, c, d, e, f, g, h):  # noqa: PLR0913\n    return a\n" > scripts/size_control.py
          if python scripts/size_gate.py > size-control.log 2>&1; then
            cat size-control.log
            exit 1
          fi
          cat size-control.log
          grep -F "Size increased: scripts/size_control.py:oversized:PLR0913 = 8" size-control.log
          rm scripts/size_control.py

      - name: Test
        run: pytest tests/ -q

      - name: Minimum Typer compatibility
        run: |
          pip uninstall -y typer
          pip install typer==0.12.0 "click<8.2"
          autoresearch --help
